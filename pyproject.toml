[project]
name = "research-agents"
version = "0.1.0"
description = "Autonomes Forschungs-Debattier-Team mit Microsoft Agent Framework 1.0 und Gemini"
requires-python = ">=3.10"
dependencies = [
    "agent-framework>=1.0.0",
    "agent-framework-gemini>=1.0.0b260722",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
